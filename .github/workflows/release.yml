name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for mcp-publisher github-oidc and attestations
      attestations: write # required for actions/attest-build-provenance

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Contract drift check
        run: |
          fail=0
          # README must not advertise removed subcommands
          for needle in "office-addin-mcp call" "office-addin-mcp daemon" "office-addin-mcp serve --stdio" "office-addin-mcp list-tools"; do
            if grep -F "$needle" README.md > /dev/null; then
              echo "::error file=README.md::README references removed subcommand '$needle'"
              fail=1
            fi
          done
          # npm/main/package.json version must agree with mcp.json
          mcp_version=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('mcp.json')).version)")
          v=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('npm/main/package.json')).version)")
          if [ "$v" != "$mcp_version" ]; then
            echo "::error file=npm/main/package.json::npm/main/package.json version $v disagrees with mcp.json $mcp_version"
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi

      - name: Check tag version is greater than npm latest
        id: version-check
        run: |
          local="${{ steps.tag.outputs.version }}"
          published=$(npm view @dsbissett/office-addin-mcp version --tag latest 2>/dev/null || echo "0.0.0")
          echo "Tag version:       $local"
          echo "Published version: $published"
          newer=$(node -e "
            const parse = v => v.split('.').map(Number);
            const [ma,mi,pa] = parse('$local');
            const [mb,mib,pb] = parse('$published');
            process.stdout.write(ma>mb || (ma===mb && mi>mib) || (ma===mb && mi===mib && pa>pb) ? 'true' : 'false');
          ")
          echo "should_publish=$newer" >> "$GITHUB_OUTPUT"
          if [ "$newer" = "false" ]; then
            echo "::warning::$GITHUB_REF_NAME ($local) is not greater than npm latest ($published); skipping publish."
          fi

      - uses: actions/setup-go@v5
        if: steps.version-check.outputs.should_publish == 'true'
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build Windows binary
        if: steps.version-check.outputs.should_publish == 'true'
        run: |
          GOOS=windows GOARCH=amd64 go build \
            -ldflags="-s -w -X main.version=${{ steps.tag.outputs.version }}" \
            -o npm/main/bin/office-addin-mcp-win32-x64.exe \
            ./cmd/office-addin-mcp

      - name: Attest binary provenance
        if: steps.version-check.outputs.should_publish == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: npm/main/bin/office-addin-mcp-win32-x64.exe

      - uses: actions/setup-node@v4
        if: steps.version-check.outputs.should_publish == 'true'
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Set package version
        if: steps.version-check.outputs.should_publish == 'true'
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          node -e "
            const fs = require('fs'), p = JSON.parse(fs.readFileSync('npm/main/package.json'));
            p.version = '$VERSION';
            fs.writeFileSync('npm/main/package.json', JSON.stringify(p, null, 2) + '\n');
          "

      - name: Publish to npm
        if: steps.version-check.outputs.should_publish == 'true'
        run: cd npm/main && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install mcp-publisher
        if: steps.version-check.outputs.should_publish == 'true'
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.7.6/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher

      - name: Set mcp.json version
        if: steps.version-check.outputs.should_publish == 'true'
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          node -e "
            const fs = require('fs'), p = JSON.parse(fs.readFileSync('mcp.json'));
            p.version = '$VERSION';
            p.packages[0].version = '$VERSION';
            fs.writeFileSync('mcp.json', JSON.stringify(p, null, 2) + '\n');
          "

      - name: Publish to MCP registry
        if: steps.version-check.outputs.should_publish == 'true'
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish mcp.json
